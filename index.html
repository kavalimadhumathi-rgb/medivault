        this.currentTab = tab;
        this.render();
        window.scrollTo({ top: 0, behavior: 'smooth' });

      handleCreatePatient(e) {
        e.preventDefault();
        const form = e.target;
        const name = form.fullName.value;
        const dob = form.dob.value;
        const age = new Date().getFullYear() - new Date(dob).getFullYear() || 35;
        const initials = name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);

        const newP = {
          id: "PC-" + Math.floor(320 + Math.random() * 80),
          name: name,
          age: age,
          gender: form.gender.value,
          dob: dob,
          bloodType: form.bloodType.value,
          department: form.department.value,
          photo: initials,
          avatarColor: "bg-teal-100 text-teal-800",
          status: "Active In-Clinic",
          riskLevel: form.riskLevel.value,
          condition: form.condition.value,
          attending: "Dr. Sarah Lin, MD",
          contact: "+1 (555) 000-" + Math.floor(1000 + Math.random() * 9000),
          email: name.toLowerCase().replace(/\s+/g, '.') + "@example.com",
          allergies: form.allergies.value ? form.allergies.value.split(',').map(a => a.trim()).filter(Boolean) : ["No Known Allergies (NKDA)"],
          medications: [
            { name: "Therapeutic Regimen", dosage: "TBD", freq: "Per physician consultation", category: "Standard of Care" }
          ],
          vitals: { hr: 72, bp: "120/80", spo2: 98, temp: "98.6", resp: 16 },
          labs: [
            { test: "Initial Screening Panel", value: "Within Limits", unit: "Normal", range: "Standard Clinical Range", status: "Normal", date: new Date().toISOString().split('T')[0] }
          ],
          notes: form.notes.value || "Initial intake completed. Baseline lab work ordered."
        };

        this.patients.unshift(newP);
        this.activePatient = newP;
        localStorage.setItem('pulsecare_patients', JSON.stringify(this.patients));
        
        const countEl = document.getElementById('header-patient-count');
        if (countEl) countEl.textContent = this.patients.length;

        this.closeModal();
        this.setTab('patients');
      }

      // --- ECG Oscilloscope Animation (HTML5 Canvas 60 FPS) ---
      initECG() {
        const canvas = document.getElementById('ecg-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let x = 0;
        let lastY = canvas.height / 2;
        const speed = 2.5;
        const beatPattern = [0, 0, 2, 4, 2, 0, -4, 28, -8, 0, 0, 3, 6, 4, 1, 0];
        let patternIdx = 0;
        let inBeat = false;
        let beatCounter = 0;

        function draw() {
          if (!canvas || !canvas.getContext) return;
          ctx.fillStyle = 'rgba(15, 23, 42, 0.08)';
          ctx.fillRect(x, 0, speed * 2, canvas.height);

          let targetOffset = 0;
          beatCounter++;
          if (beatCounter > 48) { inBeat = true; beatCounter = 0; patternIdx = 0; }
          if (inBeat) {
            if (patternIdx < beatPattern.length) { targetOffset = beatPattern[patternIdx]; patternIdx++; }
            else { inBeat = false; }
          }
          const baseline = canvas.height / 2;
          const currentY = baseline - targetOffset * 1.5 + (Math.random() * 1.2 - 0.6);

          ctx.beginPath();
          ctx.strokeStyle = '#10b981';
          ctx.lineWidth = 2;
          ctx.lineCap = 'round';
          ctx.moveTo(x - speed, lastY);
          ctx.lineTo(x, currentY);
          ctx.stroke();

          lastY = currentY;
          x += speed;
          if (x >= canvas.width) x = 0;
          requestAnimationFrame(draw);
        }
        requestAnimationFrame(draw);
      }

      // 6. Appointments & Scheduling View
      renderAppointmentsView() {
        return `
          <div class="space-y-6">
            <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-xs flex flex-wrap items-center justify-between gap-4">
              <div>
                <h2 class="text-xl font-extrabold text-slate-900">Clinical Scheduling & Appointments</h2>
                <p class="text-xs text-slate-500 mt-0.5">Manage doctor availability, telehealth slots, and in-person patient visits.</p>
              </div>
              <button onclick="alert('Appointment booking dialog is active. Select any patient to create an encounter.')" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl text-xs shadow-sm transition flex items-center gap-1.5">
                <i data-lucide="plus" class="w-4 h-4"></i> Book New Appointment
              </button>
            </div>

            <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-xs space-y-4">
              <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                  <thead>
                    <tr class="border-b border-slate-100 text-slate-400 uppercase tracking-wider font-bold">
                      <th class="pb-3">Appt ID</th>
                      <th class="pb-3">Patient</th>
                      <th class="pb-3">Scheduled Time</th>
                      <th class="pb-3">Consultation Format</th>
                      <th class="pb-3">Department</th>
                      <th class="pb-3">Status</th>
                      <th class="pb-3">Actions</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100">
                    ${this.appointments.map(apt => `
                      <tr class="hover:bg-slate-50/80 transition">
                        <td class="py-3.5 font-mono text-slate-500">${apt.id}</td>
                        <td class="py-3.5 font-bold text-slate-900">${apt.patientName}</td>
                        <td class="py-3.5 font-semibold text-slate-700">${apt.time}</td>
                        <td class="py-3.5">
                          <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold ${
                            apt.type.includes('Telehealth') ? 'bg-rose-50 text-rose-700 border border-rose-200' : 'bg-blue-50 text-blue-700'
                          }">
                            ${apt.type}
                          </span>
                        </td>
                        <td class="py-3.5 text-slate-600">${apt.dept}</td>
                        <td class="py-3.5">
                          <span class="px-2 py-0.5 rounded font-semibold text-[10px] bg-slate-100 text-slate-700">
                            ${apt.status}
                          </span>
                        </td>
                        <td class="py-3.5">
                          ${apt.type.includes('Telehealth') ? `
                            <button onclick="app.startTelehealthCall('${apt.patientId}')" class="px-3 py-1 bg-brand-600 hover:bg-brand-700 text-white rounded-lg font-bold text-[11px] transition">
                              Join Call
                            </button>
                          ` : `
                            <button onclick="app.selectPatient('${apt.patientId}')" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 text-slate-800 rounded-lg font-bold text-[11px] transition">
                              View Chart
                            </button>
                          `}
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;
      }
    }

    // Bootstrap Unified Application
    const app = new PulseCareApp();
    window.app = app;
    document.addEventListener('DOMContentLoaded', () => app.init());
  </script>
</body>
