      // ECG Canvas
      initECG() {
        const canvas = document.getElementById('ecg-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let x = 0;
        let lastY = canvas.height / 2;
        const speed = 2.5;
        const beatPattern = [0, 0, 2, 4, 2, 0, -4, 28, -8, 0, 0, 3, 6, 4, 1, 0];
        let patternIdx = 0;
        let inBeat = false;
        let beatCounter = 0;

        function draw() {
          if (!canvas || !canvas.getContext) return;
          ctx.fillStyle = 'rgba(15, 23, 42, 0.08)';
          ctx.fillRect(x, 0, speed * 2, canvas.height);

          let targetOffset = 0;
          beatCounter++;
          if (beatCounter > 48) { inBeat = true; beatCounter = 0; patternIdx = 0; }
          if (inBeat) {
            if (patternIdx < beatPattern.length) { targetOffset = beatPattern[patternIdx]; patternIdx++; }
            else { inBeat = false; }
          }
          const baseline = canvas.height / 2;
          const currentY = baseline - targetOffset * 1.5 + (Math.random() * 1.2 - 0.6);

          ctx.beginPath();
          ctx.strokeStyle = '#10b981';
          ctx.lineWidth = 2;
          ctx.lineCap = 'round';
          ctx.moveTo(x - speed, lastY);
          ctx.lineTo(x, currentY);
          ctx.stroke();

          lastY = currentY;
          x += speed;
          if (x >= canvas.width) x = 0;
          requestAnimationFrame(draw);
        }
        requestAnimationFrame(draw);
      }

                      </div>
                    </div>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${
                      item.riskLevel === 'High' ? 'bg-rose-100 text-rose-800' : item.riskLevel === 'Moderate' ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'
                    }">${item.riskLevel}</span>
                  </div>

                  <div class="text-[11px] text-slate-600 line-clamp-2 leading-relaxed bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                    ${item.condition}
                  </div>

                  <div class="flex items-center justify-between text-[11px] pt-1 border-t border-slate-100">
                    <span class="font-bold text-brand-700">${item.department}</span>
                    <span class="text-slate-400 font-mono">${item.vitals.bp}</span>
                  </div>
                </div>
              `).join('')}
            </div>

            <!-- Active Selected Patient Complete Clinical EHR Chart -->
            <div class="bg-white rounded-3xl p-6 lg:p-8 border border-slate-200 shadow-sm space-y-6">
              <div class="flex flex-wrap items-center justify-between gap-4 pb-6 border-b border-slate-100">
                <div class="flex items-center gap-4">
                  <div class="w-16 h-16 rounded-3xl ${p.avatarColor} font-black text-2xl flex items-center justify-center shadow-inner">
                    ${p.photo}
                  </div>
                  <div>
                    <div class="flex items-center gap-2">
                      <h2 class="text-2xl font-black text-slate-900">${p.name}</h2>
                      <span class="px-2.5 py-0.5 rounded-full text-xs font-mono font-bold bg-slate-100 text-slate-700 border border-slate-200">${p.id}</span>
                      <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${p.riskLevel === 'High' ? 'bg-rose-100 text-rose-800' : 'bg-emerald-100 text-emerald-800'}">${p.riskLevel} Risk</span>
                    </div>
                    <p class="text-xs text-slate-500 mt-1">
                      ${p.gender}, ${p.age} years old (DOB: ${p.dob}) • Blood Group: <strong>${p.bloodType}</strong> • Specialty: <strong>${p.department}</strong>
                    </p>
                  </div>
                </div>

                <div class="flex items-center gap-2.5">
                  <button onclick="app.setTab('telehealth')" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl text-xs shadow-sm transition flex items-center gap-1.5">
                    <i data-lucide="video" class="w-4 h-4"></i> Start Telehealth Call
                  </button>
                  <button onclick="alert('Printing verified patient record for ' + app.activePatient.name)" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl text-xs shadow-sm transition flex items-center gap-1.5">
                    <i data-lucide="printer" class="w-4 h-4"></i> Print Summary
                  </button>
                </div>
              </div>

              <!-- 3-Column Patient Details -->
              <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 text-xs">
                <!-- Allergies & Meds -->
                <div class="space-y-4">
                  <div class="p-4 bg-rose-50/70 rounded-2xl border border-rose-200 space-y-2">
                    <div class="font-bold text-rose-900 uppercase tracking-wider flex items-center gap-1.5 text-[11px]">
                      <i data-lucide="shield-alert" class="w-4 h-4 text-rose-600"></i> Documented Allergies
                    </div>
                    <div class="flex flex-wrap gap-1.5">
                      ${p.allergies.map(a => `<span class="px-2.5 py-1 rounded-lg bg-white border border-rose-200 font-bold text-rose-800 text-[11px]">${a}</span>`).join('')}
                    </div>
                  </div>

                  <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-2.5">
                    <div class="font-bold text-slate-800 uppercase tracking-wider text-[11px]">Active Prescriptions (${p.medications.length})</div>
                    <div class="space-y-2">
                      ${p.medications.map(m => `
                        <div class="p-2.5 bg-white rounded-xl border border-slate-200">
                          <div class="font-bold text-slate-900">${m.name} ${m.dosage}</div>
                          <div class="text-[11px] text-slate-500 mt-0.5">${m.freq}</div>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                </div>

                <!-- Clinical Notes & Vitals -->
                <div class="lg:col-span-2 space-y-4">
                  <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-2">
                    <div class="font-bold text-slate-800 uppercase tracking-wider text-[11px]">Attending Physician Clinical Notes</div>
                    <p class="text-slate-700 leading-relaxed text-xs">${p.notes}</p>
                  </div>

                  <div class="p-4 bg-white rounded-2xl border border-slate-200 space-y-3">
                    <div class="font-bold text-slate-800 uppercase tracking-wider text-[11px]">Diagnostic Lab Interval Results</div>
                    <div class="overflow-x-auto">
                      <table class="w-full text-left text-xs">
                        <thead>
                          <tr class="border-b border-slate-100 text-slate-400 font-bold">
                            <th class="pb-2">Test</th>
                            <th class="pb-2">Result</th>
                            <th class="pb-2">Reference</th>
                            <th class="pb-2">Status</th>
                          </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                          ${p.labs.map(l => `
                            <tr>
                              <td class="py-2.5 font-semibold text-slate-800">${l.test}</td>
                              <td class="py-2.5 font-mono font-bold text-slate-900">${l.value} ${l.unit}</td>
                              <td class="py-2.5 font-mono text-slate-500">${l.range}</td>
                              <td class="py-2.5"><span class="px-2 py-0.5 rounded font-bold text-[10px] ${l.status.includes('High') ? 'bg-rose-100 text-rose-800' : 'bg-emerald-100 text-emerald-800'}">${l.status}</span></td>
                            </tr>
                          `).join('')}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      // 3. Virtual Telehealth View
      renderTelehealthView() {
        const p = this.activePatient;
        return `
          <div class="space-y-6">
            <div class="bg-slate-900 text-white rounded-3xl p-6 shadow-xl flex flex-wrap items-center justify-between gap-4">
              <div>
                <h2 class="text-xl font-bold">Telehealth Video Encounter: ${p.name}</h2>
                <p class="text-xs text-slate-400">Department: ${p.department} • Active Patient ID: ${p.id}</p>
              </div>
              <button onclick="alert('Session connected successfully.')" class="px-4 py-2 bg-emerald-600 text-white rounded-xl font-bold text-xs">
                Live Video Online
              </button>
            </div>

            <div class="aspect-video bg-slate-950 rounded-3xl border border-slate-800 shadow-2xl flex flex-col items-center justify-center text-center p-8 text-white relative">
              <div class="w-24 h-24 rounded-full ${p.avatarColor} font-black text-3xl flex items-center justify-center shadow-xl mb-4 ring-4 ring-slate-800">
                ${p.photo}
              </div>
              <h3 class="text-lg font-bold">${p.name}</h3>
              <p class="text-xs text-slate-400 mt-1">Encrypted High-Definition Telehealth Stream (1080p WebRTC)</p>
              
              <div class="mt-6 flex items-center gap-3">
                <button onclick="alert('Microphone toggled')" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 flex items-center justify-center">
                  <i data-lucide="mic" class="w-4 h-4"></i>
                </button>
                <button onclick="alert('Camera toggled')" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 flex items-center justify-center">
                  <i data-lucide="video" class="w-4 h-4"></i>
                </button>
                <button onclick="app.setTab('patients')" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-xl">
                  Back to Chart
                </button>
              </div>
            </div>
          </div>
        `;
      }

      // 4. AI Sentinel View
      renderAITriageView() {
        return `
          <div class="bg-white rounded-3xl p-8 border border-slate-200 shadow-xs space-y-6">
            <h2 class="text-xl font-extrabold text-slate-900">AI Clinical Sentinel & Safety Engine</h2>
            <p class="text-xs text-slate-500">Screen drug interactions and analyze symptom severity triage.</p>
            <div class="p-4 bg-emerald-50 border border-emerald-200 rounded-2xl text-xs text-emerald-900">
              <strong>All ${this.patients.length} Patient Profiles Active:</strong> Ready for real-time drug contraindication screening and automated triage protocols.
            </div>
          </div>
        `;
      }

      // 5. Appointments View
      renderAppointmentsView() {
        return `
          <div class="bg-white rounded-3xl p-8 border border-slate-200 shadow-xs space-y-6">
            <div class="flex items-center justify-between">
              <div>
                <h2 class="text-xl font-extrabold text-slate-900">Outpatient & Telehealth Schedule</h2>
                <p class="text-xs text-slate-500 mt-0.5">Manage appointment bookings across all ${this.patients.length} patients</p>
              </div>
              <button onclick="app.openAddPatientModal()" class="px-4 py-2 bg-brand-600 text-white rounded-xl text-xs font-bold">
                + Register New Patient
              </button>
            </div>
            
            <div class="divide-y divide-slate-100 text-xs">
              ${this.patients.slice(0, 6).map(item => `
                <div class="py-3 flex items-center justify-between">
                  <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg ${item.avatarColor} font-black flex items-center justify-center text-xs">${item.photo}</div>
                    <div>
                      <div class="font-bold text-slate-900">${item.name}</div>
                      <div class="text-slate-500 text-[11px]">${item.department} • ${item.condition}</div>
                    </div>
                  </div>
                  <button onclick="app.selectPatient('${item.id}')" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 rounded-lg font-bold text-slate-800">
                    Open Record
                  </button>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }
    }

    const app = new PulseCareApp();
    window.app = app;
    document.addEventListener('DOMContentLoaded', () => app.init());
  </script>
</body>
</html>
